{% set name = "wheel" %}
{% set version = "0.48.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 94800765601e9171bf5d58d066e640662842bcedcbab982b2c90787a2c987322

build:
  number: 0
  skip: True  # [py<39]
  entry_points:
    - wheel = wheel._commands:main

requirements:
  host:
    - python
    - python-installer
    # Upstream wheel still declares flit_core>=3.11,<4; relax for py315 bootstrap on flit-core 4.0.2
    - flit-core >=3.11,<5
  run:
    - python
    - packaging >=26.0

test:
  imports:
    - wheel
    - wheel._commands
  requires:
    - pip
  commands:
    - pip check
    - wheel --help
    - wheel version

about:
  home: https://github.com/pypa/wheel
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: A built-package format for Python.
  description: |
    This library is the reference implementation of the Python wheel packaging standard, 
    as defined in PEP 427.
    It has two different roles:
      1. A setuptools extension for building wheels that provides the bdist_wheel setuptools command
      2. A command line tool for working with wheel files
  dev_url: https://github.com/pypa/wheel
  doc_url: https://wheel.readthedocs.io/

extra:
  recipe-maintainers:
    - jakirkham
    - pelson
    - ocefpaf
    - mingwandroid
