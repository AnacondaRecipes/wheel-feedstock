# the conda-build parameters to use for disabling --skip-existing
build_parameters:
  - "--suppress-variables"
  - "--error-overlinking"
  - "--error-overdepending"
  - "--no-test"

upload_channels:
  - ad-testing/label/py315

# After promote: consume from testing
channels:
  - ad-testing/label/py315

build_env_vars:
  ANACONDA_ROCKET_ENABLE_PY315: True
